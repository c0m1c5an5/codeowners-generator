[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov"
testpaths = ["tests"]
pythonpath = ["."]

[project]
name = "codeowners"
version = "2.1.1"
requires-python = ">=3.9"
dependencies = [
    "attrs",
    "jsonschema",
    "jsonschema-specifications",
    "referencing",
    "rpds-py",
]

[project.scripts]
codeowners = "codeowners.__main__:main"

[tool.setuptools]
packages = ["codeowners", "codeowners.core", "codeowners.shell"]

[tool.isort]
profile = "black"

[tool.ruff.lint]
pydocstyle.convention = "google"
select = [
    "RUF", # Ruff-specific rules
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "D",   # pydocstyle
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
    "PL",  # Pylint
    "TRY", # tryceratops
    "EM",  # flake8-errmsg
    "C4",  # flake8-comprehensions
    "Q",   # flake8-quotes
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
]
ignore = [
    "D100",    # Missing docstring in public module
    "D101",    # Missing docstring in public class
    "D104",    # Missing docstring in public package
    "D107",    # Missing docstring in `__init__`
    "S603",    # `subprocess` call: check for execution of untrusted input
    "S607",    # Starting a process with a partial executable path
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # Use of `assert` detected
    "PLR2004", # Magic value used in comparison
]

[dependency-groups]
dev = [
    "hypothesis>=6.141.1",
    "import-linter",
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "types-jsonschema>=4.26.0.20260202",
]

[tool.importlinter]
root_package = "codeowners"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Functional core, imperative shell"
type = "layers"
layers = [
    "codeowners.__main__",
    "codeowners.cli",
    "codeowners.shell",
    "codeowners.core",
    "codeowners.exceptions",
]

[[tool.importlinter.contracts]]
name = "Core is pure"
type = "forbidden"
source_modules = ["codeowners.core"]
# Effects and nondeterminism, which a core function must be handed the result
# of rather than reach for itself.
forbidden_modules = [
    "argparse",
    "concurrent",
    "datetime",
    "http",
    "io",
    "logging",
    "multiprocessing",
    "os",
    "random",
    "secrets",
    "shutil",
    "socket",
    "subprocess",
    "sys",
    "tempfile",
    "threading",
    "time",
    "urllib",
]
